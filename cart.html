<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <section class="cart-items">
        <h1 id="cart-heading">Your Shopping Cart</h1>
        <ul id="cart-list"></ul>
    </section>

    <section class="cart-summary">
        <h2 id="summary-heading">Cart Summary</h2>
        <p id="cart-total">Subtotal: $0.00</p>
        <a href="checkout.html" role="button">Proceed to Checkout</a>
    </section>

    <section class="empty-cart" style="display: none;">
        <h1>Your cart is currently empty</h1>
        <p><a href="products.html">Start shopping</a></p>
    </section>
</main>
    <footer><p>&copy; 2026 M.R COLLECTION</p></footer>
    <script src="script.js"></script>
</body>
</html>
